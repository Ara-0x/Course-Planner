name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository (full history for correct SHA)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show checked-out commit (must match latest main)
        run: |
          git log --oneline -5
          echo "HEAD_SHA=$(git rev-parse --short=7 HEAD)"
          echo "HEAD_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      # Single source of truth for the version: app/build.gradle.kts.
      # Nothing below may hardcode versionCode/versionName again.
      - name: Read version from app/build.gradle.kts
        id: version
        run: |
          VC=$(sed -n 's/^[[:space:]]*versionCode = \([0-9]\+\).*/\1/p' app/build.gradle.kts | head -n 1)
          VN=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$VC" ] || [ -z "$VN" ]; then
            echo "::error::Could not read versionCode/versionName from app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION_CODE=$VC" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VN" >> "$GITHUB_ENV"
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "version_name=$VN" >> "$GITHUB_OUTPUT"
          echo "Building versionCode=$VC versionName=$VN"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Install Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      # The debug keystore IS this app's distribution key (released APKs are
      # debug-signed), so its signature must stay identical across runs —
      # otherwise users cannot install updates. It lives in the
      # DEBUG_KEYSTORE_BASE64 repository secret and must never be committed.
      - name: Restore debug keystore (stable APK signature)
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          KS="$GITHUB_WORKSPACE/.ci-secrets/debug.keystore"
          mkdir -p "$(dirname "$KS")"
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > "$KS"
            echo "Restored debug keystore from DEBUG_KEYSTORE_BASE64 secret."
            echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret is missing — the build falls back to AGP's auto-generated debug key, whose APK cannot install as an update over released builds."
          fi
          if [ -f "$KS" ]; then
            ls -lh "$KS"
            # A certificate fingerprint is public data; print it so the log
            # proves which key the build was handed.
            keytool -list -v -keystore "$KS" -storepass android -alias androiddebugkey 2>/dev/null | grep -E 'Owner:|SHA256:' || true
          fi

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew

      # Tests gate the APK: a red suite must never produce a release artifact.
      - name: Unit tests (must pass before assembling)
        run: ./gradlew testDebugUnitTest --stacktrace

      # IMPORTANT: `clean` + --no-configuration-cache guarantees the APK is
      # rebuilt from current sources. Without clean, stale dex/resources from
      # the Gradle cache can make it look like "changes didn't land on APK".
      - name: Build Debug APK (clean rebuild from current sources)
        env:
          CI_KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
        run: ./gradlew clean assembleDebug --no-configuration-cache --stacktrace

      - name: Verify APK carries new version (fail if stale)
        run: |
          APK=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          echo "APK=$APK"
          ls -lh app/build/outputs/apk/debug/
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 5
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -E "versionCode='$VERSION_CODE'|versionName='$VERSION_NAME'" \
            || (echo "::error::APK version mismatch: expected versionCode $VERSION_CODE / versionName $VERSION_NAME. Stale build?"; exit 1)

      # Released APKs must carry the SAME certificate as every previous release,
      # otherwise Android rejects the update (INSTALL_FAILED_UPDATE_INCOMPATIBLE)
      # and users have to uninstall first. The constant below is the public
      # SHA-256 fingerprint of the historical debug key that signs v2.0 … v2.3.
      - name: Signature gate (APK must match the historical release key)
        env:
          EXPECTED_SIGNER_SHA256: fcced2ea0574ba6c7b9536c44846c2b697e1f841507af9e4ed00ed910bbe10ff
        run: |
          APK=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          FP=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr 'A-F' 'a-f')
          echo "APK signer SHA-256 : $FP"
          echo "expected           : $EXPECTED_SIGNER_SHA256"
          if [ "$FP" = "$EXPECTED_SIGNER_SHA256" ]; then
            echo "Signature matches the historical release key — the APK will install as an update."
          elif [ -z "$KEYSTORE_PATH" ]; then
            echo "::warning::DEBUG_KEYSTORE_BASE64 was unavailable, so the APK carries a throwaway debug key. Skipping comparison (no release should be published from such a build)."
          else
            echo "::error::APK is signed with an unexpected key. Installed builds would not be updatable — check the DEBUG_KEYSTORE_BASE64 secret and CI_KEYSTORE_PATH plumbing."
            exit 1
          fi

      # A release can no longer ship with an unchanged version: on v* tags the
      # tag must equal versionName and versionCode must be strictly greater
      # than the previous tag's versionCode (read from git history).
      - name: Version regression gate (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$VERSION_NAME" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match versionName '$VERSION_NAME' in app/build.gradle.kts"
            exit 1
          fi
          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -Fxv "$GITHUB_REF_NAME" | head -n 1)
          if [ -z "$PREV_TAG" ]; then
            echo "First version tag — nothing to compare."
            exit 0
          fi
          PREV_VC=$(git show "$PREV_TAG:app/build.gradle.kts" 2>/dev/null | sed -n 's/^[[:space:]]*versionCode = \([0-9]\+\).*/\1/p' | head -n 1)
          if [ -z "$PREV_VC" ]; then
            echo "::warning::Could not read versionCode from $PREV_TAG — skipping comparison."
            exit 0
          fi
          if [ "$VERSION_CODE" -le "$PREV_VC" ]; then
            echo "::error::versionCode $VERSION_CODE is not greater than $PREV_TAG's versionCode $PREV_VC. Bump versionCode in app/build.gradle.kts."
            exit 1
          fi
          echo "versionCode $VERSION_CODE > $PREV_TAG ($PREV_VC) — OK"

      - name: Prepare APK Asset (unique name busts CDN/browser cache)
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk "release-output/CoursePlanner-v${VERSION_NAME}-${HEAD_SHA}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "release-output/CoursePlanner-v${VERSION_NAME}.apk"
          ls -la release-output/
          sha256sum release-output/*.apk

      - name: Upload APK to Release
        # Guard: a push to `main` also runs this workflow, but only a v* tag may
        # publish a release. Without this, a branch push creates a bogus
        # "TermChin main" release (and a `main` tag) that steals "Latest".
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: TermChin ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## 🎓 TermChin | ترم‌چین — نسخه ${{ env.VERSION_NAME }}

            ### ✨ جدید در این نسخه:
            - 🧭 **دکمه «مشاهده برنامه هفتگی»:** در کارت «امروز» دیگر وارد برنامه‌ساز نمی‌شود؛ به‌جای آن به تقویم هفتگی همان صفحه خانه اسکرول می‌کند و کادر برنامه یک هایلایت کوتاه می‌گیرد
            - 🎨 **ارتقای هر ۷ پالت رنگی:** هر تم اکنون نسخه روشن و تاریک اختصاصی با تمامی نقش‌های Material 3 (primary/secondary/tertiary، containerها، سطح‌ها، خطوط و رنگ خطا) دارد؛ چیپ‌ها، دیالوگ‌ها و کارت‌های آماری هم با تم هماهنگ می‌شوند
            - 🌙 **رنگ‌های تاریک بازطراحی‌شده:** هر پالت در حالت شب لهجه و سطح‌های تیره مخصوص خودش را دارد (پیش‌تر لهجه روشن در حالت شب استفاده می‌شد)
            - 🖼️ **انتخابگر تم مدرن:** کارت‌های دوستونی با نمونه‌رنگ گرادیانی و پیش‌نمایش روشن/تاریک هر تم در تنظیمات
            - ✅ **تست کنتراست:** تست خودکار WCAG برای خوانایی متن روی هر ۱۴ اسکیم (۷ تم × ۲ حالت)

            > بعد از نصب، در صفحه «تنظیمات» پایین صفحه باید `v${{ env.VERSION_NAME }} (${{ env.VERSION_CODE }})` و هش کامیت جدید را ببینید.
          files: |
            release-output/CoursePlanner-v${{ env.VERSION_NAME }}.apk
            release-output/CoursePlanner-v${{ env.VERSION_NAME }}-${{ env.HEAD_SHA }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TermChin-v${{ env.VERSION_NAME }}-APK-${{ env.HEAD_SHA }}
          path: release-output/CoursePlanner-v${{ env.VERSION_NAME }}.apk
