name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository (full history for correct SHA)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show checked-out commit (must match latest main)
        run: |
          git log --oneline -5
          echo "HEAD_SHA=$(git rev-parse --short=7 HEAD)"
          echo "HEAD_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      # Single source of truth for the version: app/build.gradle.kts.
      # Nothing below may hardcode versionCode/versionName again.
      - name: Read version from app/build.gradle.kts
        id: version
        run: |
          VC=$(sed -n 's/^[[:space:]]*versionCode = \([0-9]\+\).*/\1/p' app/build.gradle.kts | head -n 1)
          VN=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$VC" ] || [ -z "$VN" ]; then
            echo "::error::Could not read versionCode/versionName from app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION_CODE=$VC" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VN" >> "$GITHUB_ENV"
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "version_name=$VN" >> "$GITHUB_OUTPUT"
          echo "Building versionCode=$VC versionName=$VN"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Install Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      # The RELEASE keystore signs every official APK and lives ONLY in the
      # RELEASE_KEYSTORE_BASE64 repository secret (never in git). It is written
      # to the runner's temp dir — outside the workspace — and deleted at the end
      # of the job. The historical debug key is retired; see docs/SECURITY.md.
      - name: Restore release keystore (never from git)
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/termchin-release.jks"
          MISSING=""
          [ -n "$RELEASE_KEYSTORE_B64" ] || MISSING="$MISSING RELEASE_KEYSTORE_BASE64"
          [ -n "$RELEASE_KEYSTORE_PASSWORD" ] || MISSING="$MISSING RELEASE_KEYSTORE_PASSWORD"
          [ -n "$RELEASE_KEY_ALIAS" ] || MISSING="$MISSING RELEASE_KEY_ALIAS"
          [ -n "$RELEASE_KEY_PASSWORD" ] || MISSING="$MISSING RELEASE_KEY_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing signing secret(s):$MISSING — refusing to build an unsigned release APK."
            exit 1
          fi
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > "$KS"
          echo "RELEASE_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          # A certificate fingerprint is public data; print it so the log proves
          # which key the build was handed.
          keytool -list -v -keystore "$KS" -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" | grep -E 'Owner:|SHA256:' || true

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew

      # A private signing key once lived in git history (see docs/SECURITY.md).
      # This gate makes sure no keystore/base64 material can ever be tracked
      # again: the distribution key must exist ONLY in the GitHub secret and on
      # the maintainer's machine.
      - name: Secret-hygiene gate (no signing material tracked in git)
        run: |
          LEAKED=$(git ls-files | grep -Ei '\.(jks|keystore|b64|base64)$|(^|/)debug\.keystore$' || true)
          if [ -n "$LEAKED" ]; then
            echo "::error::Signing material is tracked in git — remove it now (it must live only in the RELEASE_KEYSTORE_BASE64 secret):"
            echo "$LEAKED"
            exit 1
          fi
          echo "OK: no keystore/base64 file is tracked."

      # Tests gate the APK: a red suite must never produce a release artifact.
      - name: Unit tests (must pass before assembling)
        run: ./gradlew testDebugUnitTest --stacktrace

      # IMPORTANT: `clean` + --no-configuration-cache guarantees the APK is
      # rebuilt from current sources. Without clean, stale dex/resources from
      # the Gradle cache can make it look like "changes didn't land on APK".
      # The signing passwords are handed to THIS step only: the keystore path
      # arrives via $GITHUB_ENV from the restore step, but secrets exported as
      # step-level env in one step do not reach later steps.
      - name: Build Release APK (clean rebuild from current sources)
        env:
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease --no-configuration-cache --stacktrace

      - name: Verify APK carries new version (fail if stale)
        run: |
          APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "APK=$APK"
          ls -lh app/build/outputs/apk/release/
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 5
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -E "versionCode='$VERSION_CODE'|versionName='$VERSION_NAME'" \
            || (echo "::error::APK version mismatch: expected versionCode $VERSION_CODE / versionName $VERSION_NAME. Stale build?"; exit 1)

      # Official APKs must carry the CURRENT TermChin release certificate, and a
      # debug-signed APK must never reach a release. The constant below is the
      # public SHA-256 fingerprint of the release key generated for the 2026-09
      # migration (the historical debug key fcced2ea… is retired). A mismatch —
      # including a debug/throwaway signature — fails the build.
      - name: Signature gate (APK must carry the current release key)
        env:
          EXPECTED_SIGNER_SHA256: 0d38aa655105b0af6a0c0a1d26b37dbb872d20b6b4ab63fbeb9f88aa195adda0
        run: |
          APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK found to verify."
            exit 1
          fi
          FP=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr 'A-F' 'a-f')
          echo "APK signer SHA-256 : $FP"
          echo "expected           : $EXPECTED_SIGNER_SHA256"
          if [ "$FP" != "$EXPECTED_SIGNER_SHA256" ]; then
            echo "::error::APK is not signed with the TermChin release key — refusing to publish. Check RELEASE_KEYSTORE_BASE64 / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD."
            exit 1
          fi
          echo "Signature matches the TermChin release key."

      # A release can no longer ship with an unchanged version: on v* tags the
      # tag must equal versionName and versionCode must be strictly greater
      # than the previous tag's versionCode (read from git history).
      - name: Version regression gate (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$VERSION_NAME" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match versionName '$VERSION_NAME' in app/build.gradle.kts"
            exit 1
          fi
          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -Fxv "$GITHUB_REF_NAME" | head -n 1)
          if [ -z "$PREV_TAG" ]; then
            echo "First version tag — nothing to compare."
            exit 0
          fi
          PREV_VC=$(git show "$PREV_TAG:app/build.gradle.kts" 2>/dev/null | sed -n 's/^[[:space:]]*versionCode = \([0-9]\+\).*/\1/p' | head -n 1)
          if [ -z "$PREV_VC" ]; then
            echo "::warning::Could not read versionCode from $PREV_TAG — skipping comparison."
            exit 0
          fi
          if [ "$VERSION_CODE" -le "$PREV_VC" ]; then
            echo "::error::versionCode $VERSION_CODE is not greater than $PREV_TAG's versionCode $PREV_VC. Bump versionCode in app/build.gradle.kts."
            exit 1
          fi
          echo "versionCode $VERSION_CODE > $PREV_TAG ($PREV_VC) — OK"

      - name: Prepare APK Asset (unique name busts CDN/browser cache)
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk "release-output/CoursePlanner-v${VERSION_NAME}-${HEAD_SHA}.apk"
          cp app/build/outputs/apk/release/app-release.apk "release-output/CoursePlanner-v${VERSION_NAME}.apk"
          ls -la release-output/
          sha256sum release-output/*.apk

      - name: Upload APK to Release
        # Guard: a push to `main` also runs this workflow, but only a v* tag may
        # publish a release. Without this, a branch push creates a bogus
        # "TermChin main" release (and a `main` tag) that steals "Latest".
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: TermChin ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## 🎓 TermChin | ترم‌چین — نسخه ${{ env.VERSION_NAME }}

            > ## ⚠️ اطلاعیهٔ مهم — این نسخه نیازمند «حذف و نصب مجدد» است
            >
            > این نسخه با کلید جدید (`CN=TermChin Release`) ساخته شده و روی نصب‌های قبلی شما (امضاشده با کلید قدیمی `CN=Android Debug`) نصب *نمی‌شود*؛ اندروید خطای «برنامه نصب نشد» (`INSTALL_FAILED_UPDATE_INCOMPATIBLE`) می‌دهد. این تصمیم امنیتی به‌خاطر افشای کلید قدیمی در تاریخچهٔ عمومی مخزن گرفته شده است.
            >
            > **قبل از نصب، یک‌بار این کارها را انجام دهید:**
            >
            > 1. در اپ قدیمی، «تنظیمات» ← **«خروجی دروس و گروه‌ها (Export)»**: متن JSON را کپی و بیرون از گوشی نگه دارید؛ و «خانه» ← **«خروجی و اشتراک‌گذاری برنامه»** برای ذخیرهٔ متن برنامهٔ هفتگی. ⚠️ این خروجی فقط دروس/گروه‌ها (و متن برنامه) را پوشش می‌دهد — **جزوات، عکس‌ها و تنظیمات ذخیره نمی‌شوند**؛ مستندات مهم را جداگانه نگه دارید.
            > 2. اپ را کامل **حذف (Uninstall)** کنید — حذف، دیتابیس داخلی را پاک می‌کند.
            > 3. همین نسخه را نصب کنید و JSON را از «تنظیمات» ← **«ورود داده با فرمت JSON»** برگردانید.
            >
            > جزئیات فنی: `docs/SECURITY.md`.
            >
            > ⚠️ **English:** This release is signed with the new TermChin key and cannot install as an update over older installs (`INSTALL_FAILED_UPDATE_INCOMPATIBLE`). Back up first (Settings → Export JSON — covers courses/groups only, not attachments/settings), uninstall once, install this APK, re-import via Settings → JSON import. Details: `docs/SECURITY.md`.


            ### ✨ جدید در این نسخه:
            - 🛡️ **حذف پاکسازی خودکار هنگام اجرا:** دیگر هیچ به‌روزرسانی نمی‌تواند به‌خاطر یک پرچمِ گمشده، دیتابیس درس‌ها/برنامه/جزوات شما را پاک کند (با تست رگرسیون تضمین شده)
            - 🚫 **برنامهٔ ناقص اعمال نمی‌شود:** اگر برای درسی از دروس انتخاب‌شده گروه قابل استفاده‌ای پیدا نشود، نامش گزارش می‌شود ولی دکمهٔ «اعمال» غیرفعال می‌ماند تا برنامهٔ کامل شما جایگزین نشود
            - ✅ **کد درس/گروه یکتا و بدون کد ساختگی:** ثبت کد تکراری یا خالی فقط با پیام خطای مشخص رد می‌شود (دیگر `CRS-…` یا `01` خودکار ساخته نمی‌شود)
            - ⏱️ **اعتبارسنجی جلسات هر گروه:** جلسات هم‌پوشانِ یک گروه (با رعایت زوج/فرد) قبل از ذخیره رد می‌شوند
            - 📊 **توضیح امتیاز صادقانه:** جمع ردیف‌های «چرا این برنامه؟» همیشه برابر امتیاز نمایش‌داده‌شده است (به‌همراه ردیف صریح محدودسازی ۰ تا ۱۰۰)
            - 📥 **تفکیک خطاهای دریافت فایل:** خطای خواندنِ فایل ≠ فایلِ خالی ≠ فایلِ بدونِ درس — هر کدام پیام جداگانه دارند
            - 🧹 حذف کد بلااستفادهٔ WebView پرتال و بازنویسی README مطابق رفتار واقعی اپ

            > بعد از نصب، در صفحه «تنظیمات» پایین صفحه باید `v${{ env.VERSION_NAME }} (${{ env.VERSION_CODE }})` و هش کامیت جدید را ببینید.
          files: |
            release-output/CoursePlanner-v${{ env.VERSION_NAME }}.apk
            release-output/CoursePlanner-v${{ env.VERSION_NAME }}-${{ env.HEAD_SHA }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TermChin-v${{ env.VERSION_NAME }}-APK-${{ env.HEAD_SHA }}
          path: release-output/CoursePlanner-v${{ env.VERSION_NAME }}.apk

      # The restored keystore must not survive the job. RUNNER_TEMP is wiped
      # with the runner anyway; this makes the intent explicit and covers
      # self-hosted runners.
      - name: Remove restored release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/termchin-release.jks"
