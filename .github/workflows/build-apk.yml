name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository (full history for correct SHA)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show checked-out commit (must match latest main)
        run: |
          git log --oneline -5
          echo "HEAD_SHA=$(git rev-parse --short=7 HEAD)"
          echo "HEAD_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Install Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Restore Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh debug.keystore

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew

      # IMPORTANT: `clean` + --no-configuration-cache guarantees the APK is
      # rebuilt from current sources. Without clean, stale dex/resources from
      # the Gradle cache can make it look like "changes didn't land on APK".
      - name: Build Debug APK (clean rebuild from current sources)
        run: ./gradlew clean assembleDebug --no-configuration-cache --stacktrace

      - name: Verify APK carries new version (fail if stale)
        run: |
          APK=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          echo "APK=$APK"
          ls -lh app/build/outputs/apk/debug/
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 5
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -E "versionCode='6'|versionName='1.4.0'" \
            || (echo "::error::APK version mismatch: expected versionCode 6 / versionName 1.4.0. Stale build?"; exit 1)

      - name: Prepare APK Asset (unique name busts CDN/browser cache)
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk "release-output/CoursePlanner-v1.4.0-${HEAD_SHA}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk release-output/CoursePlanner-v1.4.0.apk
          ls -la release-output/
          sha256sum release-output/*.apk

      - name: Upload APK to Release v1.4.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          target_commitish: ${{ github.sha }}
          name: Course Planner v1.4.0
          draft: false
          prerelease: false
          body: |
            ## 🎓 برنامه‌ریز درسی دانشگاه (نسخه ۱.۴.۰)

            ### ✨ جدید در این نسخه:
            - 📌 **تب‌های وضعیت و مرتب‌سازی همیشه در دسترس:** از پنل کشویی بیرون آمدند و درست بالای «دروس ثبت‌شده» پین شدند
            - 🎛️ **پنل «فیلترهای پیشرفته» جمع‌شونده** با خلاصه یک‌خطی فیلترهای فعال روی هدر بسته و انیمیشن نرم باز/بسته‌شونده

            ### قبلی (۱.۳.۰):
            - 🎓 فیلتر مقطع (کاردانی/کارشناسی/ارشد)، فیلتر واحد و روز کلاس

            > بعد از نصب، در صفحه «تنظیمات» پایین صفحه باید `v1.4.0 (6)` و هش کامیت جدید را ببینید.
          files: |
            release-output/CoursePlanner-v1.4.0.apk
            release-output/CoursePlanner-v1.4.0-${{ env.HEAD_SHA }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoursePlanner-v1.4.0-APK-${{ env.HEAD_SHA }}
          path: release-output/CoursePlanner-v1.4.0.apk
